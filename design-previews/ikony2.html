<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alternativy k sadě 15 - Profiweb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500&display=swap" rel="stylesheet">
<style>
  :root { --blue:#3793d1; --ink:#000; --muted:#66676c; --line:#efefef; --surface:#fafafa; }
  *,*::before,*::after { box-sizing:border-box; }
  body {
    margin:0; padding:48px 32px 96px; background:#fff; color:var(--ink);
    font-family:Inter,system-ui,sans-serif; font-variation-settings:"opsz" 32;
    -webkit-font-smoothing:antialiased;
  }
  h1 { font-size:28px; font-weight:500; letter-spacing:-.02em; margin:0 0 8px; }
  .lede { max-width:66ch; margin:0 0 40px; font-size:16px; line-height:1.65; color:var(--muted); }

  .cols { display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:20px; align-items:start; }
  .col { border:1px solid var(--line); border-radius:14px; padding:20px 22px 12px; }
  .col__head { margin-bottom:6px; }
  .col__label { font-size:15px; font-weight:500; letter-spacing:-.01em; }
  .col__note { font-size:12.5px; color:var(--muted); margin-top:3px; }

  .opt { display:flex; align-items:center; gap:16px; padding:14px 0; border-top:1px solid var(--line); }
  .opt__code {
    flex:none; width:30px; font-size:12px; color:var(--blue);
    background:#e8f2fa; border-radius:20px; padding:3px 0; text-align:center;
  }
  .opt__big { flex:none; width:44px; height:44px; color:var(--blue); }
  .opt__ctx { display:flex; align-items:center; gap:9px; font-size:14px; color:var(--blue); min-width:0; }
  .opt__ctx svg { width:19px; height:19px; flex:none; }
  .opt__name { margin-left:auto; font-size:12.5px; color:var(--muted); white-space:nowrap; }
  .opt--now { background:var(--surface); margin-inline:-22px; padding-inline:22px; }
  .opt--now .opt__name::after { content:" · teď"; color:var(--blue); }

  svg { fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
<body>

<h1>Alternativy ke stejnému stylu</h1>
<p class="lede">
  Sada 15 nasazená, ale ne každý ze tří symbolů sedí stejně dobře. Tady je ke
  každému popisku šest variant, <strong>všechny ve stylu sady 15</strong>
  (linka 1,6, kulaté konce, konkrétní předmět). Šedý řádek je to, co je na webu
  teď. Řekni kód, třeba <em>B4</em>, a přehodím jen tu jednu ikonu.
</p>

<div class="cols" id="cols"></div>

<script>
/* Každá varianta: kód, jméno, path(y). Styl je společný, mění se jen metafora. */
var COLS = [
  {
    label: "Spuštěno za 2 týdny",
    note: "rychlost, krátká lhůta",
    opts: [
      { k:"A1", n:"blesk", now:true, d:['M13 2 4 14h7l-1 8 9-12h-7z'] },
      { k:"A2", n:"stopky", d:['M12 21.5a7.5 7.5 0 1 0 0-15 7.5 7.5 0 0 0 0 15z','M12 14v-3.5','M12 6.5V4','M9.5 4h5','M18.4 8.6 20 7'] },
      { k:"A3", n:"kalendář s odškrtnutím", d:['M4 6.5h16v14H4z','M8 3.5v5M16 3.5v5','M4 11h16','M9 15.5l2.2 2.2 4-4'] },
      { k:"A4", n:"tachometr", d:['M3.8 17.6a8.2 8.2 0 1 1 16.4 0','M12 17.6 16 11.4'] },
      { k:"A5", n:"přesýpací hodiny", d:['M6.5 3h11M6.5 21h11','M17 3v3.6L12 12l5 5.4V21','M7 3v3.6L12 12l-5 5.4V21'] },
      { k:"A6", n:"vlajka / spuštění", d:['M5 21.5V3','M5 4.5h13.5l-2.7 4 2.7 4H5z'] }
    ]
  },
  {
    label: "Pevná cena předem",
    note: "žádné doúčtování, cena daná dopředu",
    opts: [
      { k:"B1", n:"štít s odškrtnutím", now:true, d:['M12 3 4 6v6c0 5 3.4 7.6 8 9 4.6-1.4 8-4 8-9V6z','m9 12 2 2 4-4'] },
      { k:"B2", n:"zámek", d:['M4.8 10.5h14.4v10H4.8z','M8.2 10.5V7a3.8 3.8 0 0 1 7.6 0v3.5','M12 14.5v2.5'] },
      { k:"B3", n:"cenovka", d:['M20.4 12.6 12.6 4.8a1.6 1.6 0 0 0-1.1-.5H5.2A.9.9 0 0 0 4.3 5.2v6.3c0 .4.2.8.5 1.1l7.8 7.8a1.6 1.6 0 0 0 2.3 0l5.5-5.5a1.6 1.6 0 0 0 0-2.3z','M8 8v.01'] },
      { k:"B4", n:"bankovka", d:['M2.5 6.5h19v11h-19z','M12 14.6a2.6 2.6 0 1 0 0-5.2 2.6 2.6 0 0 0 0 5.2z','M6 9.8v4.4M18 9.8v4.4'] },
      { k:"B5", n:"nabídka / účtenka", d:['M5.5 3h13v18l-2.6-1.8-2.6 1.8-2.6-1.8-2.6 1.8z','M9 8.5h6M9 12.5h6'] },
      { k:"B6", n:"mince s odškrtnutím", d:['M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z','m8 12.2 2.6 2.6L16 9.4'] }
    ]
  },
  {
    label: "Zaměřeno na poptávky",
    note: "výsledek je poptávka, ne návštěva",
    opts: [
      { k:"C1", n:"trychtýř", now:true, d:['M3 4h18l-7.5 8.6V21l-3-1.6v-6.8z'] },
      { k:"C2", n:"terč", d:['M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z','M12 16.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9z','M12 13.2v.01'] },
      { k:"C3", n:"magnet", d:['M6 4.5v7.8a6 6 0 0 0 12 0V4.5h-4.4v7.8a1.6 1.6 0 0 1-3.2 0V4.5z','M6 8.6h4.4M13.6 8.6H18'] },
      { k:"C4", n:"rostoucí křivka", d:['M3.5 16.5 9.2 10.8l3.3 3.3 7.5-7.6','M14.6 6.5h5.4v5.4'] },
      { k:"C5", n:"zpráva / poptávka", d:['M4 4.5h16a1.6 1.6 0 0 1 1.6 1.6v8.8a1.6 1.6 0 0 1-1.6 1.6h-8.6L7 21v-4.5H4a1.6 1.6 0 0 1-1.6-1.6V6.1A1.6 1.6 0 0 1 4 4.5z','M6.5 8.5h11M6.5 12h7'] },
      { k:"C6", n:"kurzor / konverze", d:['M5.5 3 18 10.6l-5.3 1.5-2.4 5.4z'] }
    ]
  }
];

function svg(paths, cls) {
  return '<svg class="' + cls + '" viewBox="0 0 24 24" aria-hidden="true">'
       + paths.map(function (d) { return '<path d="' + d + '"/>'; }).join('')
       + '</svg>';
}

document.getElementById('cols').innerHTML = COLS.map(function (col) {
  return '<div class="col">'
    + '<div class="col__head"><div class="col__label">' + col.label + '</div>'
    + '<div class="col__note">' + col.note + '</div></div>'
    + col.opts.map(function (o) {
        return '<div class="opt' + (o.now ? ' opt--now' : '') + '">'
          + '<span class="opt__code">' + o.k + '</span>'
          + svg(o.d, 'opt__big')
          + '<span class="opt__ctx">' + svg(o.d, '') + col.label + '</span>'
          + '<span class="opt__name">' + o.n + '</span>'
          + '</div>';
      }).join('')
    + '</div>';
}).join('');
</script>

</body>
</html>
