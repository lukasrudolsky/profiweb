<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Výběr ikon - Profiweb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500&display=swap" rel="stylesheet">
<style>
  :root { --blue:#3793d1; --ink:#000; --muted:#66676c; --line:#efefef; --surface:#fafafa; }
  *,*::before,*::after { box-sizing:border-box; }
  body {
    margin:0; padding:48px 32px 96px; background:#fff; color:var(--ink);
    font-family:Inter,system-ui,sans-serif; font-variation-settings:"opsz" 32;
    -webkit-font-smoothing:antialiased;
  }
  h1 { font-size:28px; font-weight:500; letter-spacing:-.02em; margin:0 0 8px; }
  .lede { max-width:64ch; margin:0 0 40px; font-size:16px; line-height:1.65; color:var(--muted); }
  .lede code { background:var(--surface); padding:2px 6px; border-radius:5px; font-size:13px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:20px; }
  .set { border:1px solid var(--line); border-radius:14px; padding:20px 22px 18px; }
  .set__head { display:flex; align-items:baseline; gap:10px; margin-bottom:18px; }
  .set__no {
    display:grid; place-items:center; flex:none; width:24px; height:24px;
    font-size:12px; color:var(--blue); background:#e8f2fa; border-radius:50%;
  }
  .set__name { font-size:15px; font-weight:500; letter-spacing:-.01em; }
  .set__note { font-size:12.5px; color:var(--muted); margin-left:auto; }

  /* velký náhled */
  .big { display:flex; gap:26px; padding:16px 0 20px; border-bottom:1px solid var(--line); }
  .big svg { width:44px; height:44px; color:var(--blue); }

  /* jak to bude vypadat v řádku výhod */
  .row { display:flex; flex-wrap:wrap; gap:22px; padding-top:16px; }
  .row div { display:flex; align-items:center; gap:9px; font-size:14px; color:var(--blue); white-space:nowrap; }
  .row svg { width:19px; height:19px; flex:none; }

  svg { fill:none; stroke:currentColor; }
</style>
</head>
<body>

<h1>Výběr ikon pro řádek výhod</h1>
<p class="lede">
  16 sad po třech. Nahoře velký náhled, dole to samé v kontextu, tak, jak to
  bude na webu vypadat doopravdy. Řekni číslo sady a nasadím ji.
</p>

<div class="grid" id="grid"></div>

<script>
/* Tři významy, které trojice musí unést. */
var LABELS = ["Spuštěno za 2 týdny", "Pevná cena předem", "Zaměřeno na poptávky"];

/* stroke: šířka, cap, join, případně fill pro plné varianty */
var SETS = [
  { name:"Klasika, kulaté", note:"outline 1.6", s:{w:1.6,c:"round",j:"round"}, i:[
    '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
    '<path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.4" cy="7.4" r="1.2"/>',
    '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/>' ]},

  { name:"Geometrie, ostré", note:"bez kružnic", s:{w:1.7,c:"square",j:"miter"}, i:[
    '<path d="M6 3h12M6 21h12M8 3v4l4 4 4-4V3M8 21v-4l4-4 4 4v4"/>',
    '<rect x="3" y="6" width="18" height="12"/><path d="M7 12h10"/>',
    '<path d="M12 3v5M12 16v5M3 12h5M16 12h5"/><path d="M9 9h6v6H9z"/>' ]},

  { name:"Duotone", note:"tenká linka + plný akcent", s:{w:1.5,c:"round",j:"round"}, i:[
    '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/>',
    '<path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.4" cy="7.4" r="1.5" fill="currentColor" stroke="none"/>',
    '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/>' ]},

  { name:"Plné tvary", note:"solid, bez obrysu", s:{w:0,c:"round",j:"round",fill:1}, i:[
    '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
    '<path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4zM7.4 9a1.6 1.6 0 1 1 0-3.2 1.6 1.6 0 0 1 0 3.2z"/>',
    '<path d="M3 4h18l-7.5 8.6V21l-3 1.6v-10z"/>' ]},

  { name:"Vlasové", note:"stroke 1.1", s:{w:1.1,c:"round",j:"round"}, i:[
    '<circle cx="12" cy="13" r="8"/><path d="M12 9.5V13l2.8 1.6"/><path d="M9.5 2h5M12 2v3"/>',
    '<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8.5h6M9 12.5h6"/>',
    '<path d="M3 17 10 10l4 4 7-7"/><path d="M15 7h6v6"/>' ]},

  { name:"Tučné kulaté", note:"stroke 2.3", s:{w:2.3,c:"round",j:"round"}, i:[
    '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
    '<rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
    '<path d="M6 4v8a6 6 0 0 0 12 0V4"/><path d="M6 9.5h4M14 9.5h4"/>' ]},

  { name:"V zaobleném čtverci", note:"glyf v rámu", s:{w:1.5,c:"round",j:"round"}, i:[
    '<rect x="2.5" y="2.5" width="19" height="19" rx="5"/><path d="M12 7.5V12l3 1.8"/>',
    '<rect x="2.5" y="2.5" width="19" height="19" rx="5"/><path d="M8 9.5h8M8 14.5h8"/>',
    '<rect x="2.5" y="2.5" width="19" height="19" rx="5"/><path d="M7 15l3.5-3.5 2.5 2.5L17 9"/>' ]},

  { name:"V kruhu", note:"glyf v kruhu", s:{w:1.5,c:"round",j:"round"}, i:[
    '<circle cx="12" cy="12" r="9.5"/><path d="M12 7.5V12l3 1.8"/>',
    '<circle cx="12" cy="12" r="9.5"/><path d="M12 7v10M9.6 9.4h4a2 2 0 0 1 0 4h-3.2a2 2 0 0 0 0 4h4"/>',
    '<circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.5l3 3 6-6"/>' ]},

  { name:"Šipkové", note:"vše ze šipek", s:{w:1.7,c:"round",j:"round"}, i:[
    '<path d="M4 7l6 5-6 5z"/><path d="M13 7l6 5-6 5z"/>',
    '<path d="M12 4v11"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M5 20h14"/>',
    '<path d="M3 12h7"/><path d="M21 12h-4"/><path d="M13.5 8.5 17 12l-3.5 3.5"/><circle cx="12" cy="12" r="1.6"/>' ]},

  { name:"Chevron z loga", note:"úhly 45°", s:{w:1.8,c:"square",j:"miter"}, i:[
    '<path d="M3 8l5 6 4-5 4 5 5-6"/><path d="M3 17h18"/>',
    '<path d="M4 6h16"/><path d="M4 18h16"/><path d="M9 9l3 3-3 3"/>',
    '<path d="M4 5l8 7 8-7"/><path d="M4 12l8 7 8-7"/>' ]},

  { name:"Typografické", note:"znak místo obrázku", s:{w:1.6,c:"round",j:"round",text:1}, i:[
    '14 dní', 'Kč', '→' ]},

  { name:"Minimal tečka + linka", note:"maximálně zjednodušené", s:{w:1.6,c:"round",j:"round"}, i:[
    '<path d="M4 12h10"/><circle cx="18" cy="12" r="2.4"/>',
    '<path d="M4 9h16M4 15h16"/>',
    '<circle cx="12" cy="12" r="2.4"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3"/>' ]},

  { name:"Negativní prostor", note:"plný tvar s výřezem", s:{w:0,c:"round",j:"round",fill:1}, i:[
    '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 5v4.4l3 1.8-1 1.7-4-2.4V7z"/>',
    '<path d="M3 5h18v14H3zm3 6a1.5 1.5 0 1 0 0 3h12a1.5 1.5 0 0 0 0-3z"/>',
    '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 4.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11zm0 3.5a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/>' ]},

  { name:"Doslovné", note:"kalendář, bankovky, lidé", s:{w:1.6,c:"round",j:"round"}, i:[
    '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 12h.01M18 12h.01"/>',
    '<circle cx="9" cy="8" r="3.4"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5a3.4 3.4 0 0 1 0 6.8"/><path d="M17.5 20a6 6 0 0 0-2-4.4"/>' ]},

  { name:"Blesk, štít, trychtýř", note:"rychlost, jistota, filtr", s:{w:1.6,c:"round",j:"round"}, i:[
    '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
    '<path d="M12 3 4 6v6c0 5 3.4 7.6 8 9 4.6-1.4 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
    '<path d="M3 4h18l-7.5 8.6V21l-3-1.6v-6.8z"/>' ]},

  { name:"Stopky, mince, zpráva", note:"konkrétní děje", s:{w:1.6,c:"round",j:"round"}, i:[
    '<circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.6 1.5"/><path d="M9.5 2h5M12 2v4"/><path d="m18.5 7 1.6-1.6"/>',
    '<circle cx="12" cy="12" r="9"/><path d="M12 7v10"/><path d="M9.6 9.4h4a2 2 0 0 1 0 4h-3.2a2 2 0 0 0 0 4h4"/>',
    '<path d="M4 5h16v11H9.5L5 19.5V16H4z"/><path d="M8.5 10.5h7"/>' ]}
];

var grid = document.getElementById("grid");

function svg(set, inner, size) {
  if (set.s.text) {
    return '<svg viewBox="0 0 24 24" style="width:' + size + 'px;height:' + size + 'px">' +
           '<text x="12" y="16" text-anchor="middle" fill="currentColor" stroke="none" ' +
           'style="font:500 ' + (inner.length > 3 ? 6 : 10) + 'px Inter">' + inner + '</text></svg>';
  }
  var fill = set.s.fill ? 'currentColor' : 'none';
  var sw = set.s.fill ? 0 : set.s.w;
  return '<svg viewBox="0 0 24 24" style="width:' + size + 'px;height:' + size + 'px' +
         ';fill:' + fill + ';stroke-width:' + sw + ';stroke-linecap:' + set.s.c +
         ';stroke-linejoin:' + set.s.j + '">' + inner + '</svg>';
}

SETS.forEach(function (set, n) {
  var card = document.createElement("div");
  card.className = "set";

  var big = set.i.map(function (g) { return svg(set, g, 44); }).join("");
  var row = set.i.map(function (g, k) {
    return '<div>' + svg(set, g, 19) + '<span>' + LABELS[k] + '</span></div>';
  }).join("");

  card.innerHTML =
    '<div class="set__head"><span class="set__no">' + (n + 1) + '</span>' +
    '<span class="set__name">' + set.name + '</span>' +
    '<span class="set__note">' + set.note + '</span></div>' +
    '<div class="big">' + big + '</div>' +
    '<div class="row">' + row + '</div>';

  grid.appendChild(card);
});
</script>
</body>
</html>
